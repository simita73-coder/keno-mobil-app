name: APK építése

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # Fix aláírókulcs: így az új APK felülírja a régit (nem kell törölni)
      FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/keno-nc.jks
      FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: kenonc2026
      FLET_ANDROID_SIGNING_KEY_PASSWORD: kenonc2026
      FLET_ANDROID_SIGNING_KEY_ALIAS: keno
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flet telepítése
        run: pip install "flet==1.1.2" "flet-cli==1.1.2"

      - name: APK építése (a Flutter, JDK és Android SDK magától települ)
        run: flet build apk --yes --no-rich-output --log-format github --arch arm64-v8a

      - name: APK előkészítése
        run: |
          ls -la build/apk
          cp "$(ls build/apk/*.apk | head -n 1)" keno-nc.apk

      - name: Közvetlen letöltési hivatkozás (Releases)
        run: |
          gh release delete apk-legfrissebb --cleanup-tag --yes || true
          gh release create apk-legfrissebb keno-nc.apk \
            --title "Legfrissebb Keno NC APK" \
            --notes "Keno NC mobil – automatikusan épített APK. Commit: ${{ github.sha }}" \
            --target ${{ github.sha }}

      - name: APK mentése a futáshoz is (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: keno-nc-apk
          path: keno-nc.apk
